<div class="reserva-container">
    <!-- Success Toast -->
    <div class="success-toast" [class.show]="showSuccessToast">
        ✓ Reserva criada com sucesso!
    </div>

    <!-- Header -->
    <div class="header">
        <h1>Fazer Reserva</h1>
        <p>Preencha os dados abaixo para confirmar sua viagem</p>
    </div>

    <!-- Loading -->
    <div *ngIf="loadingData" class="loading-overlay">
        <div class="spinner"></div>
        <p>Carregando dados...</p>
    </div>

    <!-- Form Container -->
    <div class="form-container" *ngIf="!loadingData">
        <!-- Row 1: Nome e Email -->
        <div class="form-row two-cols">
            <div class="form-group">
                <label>Nome Completo</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-user"></span>
                    <input type="text" class="form-input" placeholder="Digite seu nome" [(ngModel)]="formData.nomeUsuario" name="nomeUsuario">
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-mail"></span>
                    <input type="email" class="form-input" placeholder="seu@email.com" [(ngModel)]="formData.email" name="email" required>
                </div>
            </div>
        </div>

        <!-- Row 2: Telefone, Destino, Pacote -->
        <div class="form-row three-cols">
            <div class="form-group">
                <label>Telefone</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-phone"></span>
                    <input type="tel" class="form-input" placeholder="+244 923 456 789" [(ngModel)]="formData.telefone" name="telefone" required>
                </div>
            </div>

            <div class="form-group">
                <label>Destino</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-map"></span>
                    <select class="form-select" [(ngModel)]="formData.destinoId" name="destinoId" required>
            <option value="">Selecione</option>
            <option *ngFor="let destino of destinos" [value]="destino.id">
              {{ destino.nomeCidade }}
            </option>
          </select>
                </div>
            </div>

            <div class="form-group">
                <label>Pacote</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-package"></span>
                    <select class="form-select" [(ngModel)]="formData.nomePacote" name="nomePacote" required>
            <option value="">Selecione</option>
            <option *ngFor="let pacote of pacotes" [value]="pacote.nomePacote">
              {{ pacote.nomePacote }}
            </option>
          </select>
                </div>
            </div>
        </div>

        <!-- Row 3: Datas e Pessoas -->
        <div class="form-row three-cols">
            <div class="form-group">
                <label>Data de Reserva</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-calendar"></span>
                    <input type="date" class="form-input" [(ngModel)]="formData.dataReserva" (change)="onDataInicioChange()" name="dataReserva" [min]="dataMinima" required>
                </div>
            </div>

            <div class="form-group">
                <label>Data da Viagem</label>
                <div class="input-wrapper">
                    <span class="input-icon icon-calendar"></span>
                    <input type="date" class="form-input" [(ngModel)]="formData.dataViagem" name="dataViagem" [min]=" formData.dataReserva " required>
                </div>
            </div>

            <div class="form-group ">
                <label>Nº de Pessoas</label>
                <div class="input-wrapper ">
                    <span class="input-icon icon-users "></span>
                    <input type="number " class="form-input " [(ngModel)]="formData.quantidadePessoas " name="numeroPessoas " min="1 " max="20 " required>
                </div>
            </div>
        </div>

        <!-- Observações -->
        <div class="form-row ">
            <div class="form-group ">
                <label>Observações (Opcional)</label>
                <div class="input-wrapper ">
                    <span class="input-icon icon-text "></span>
                    <textarea class="form-textarea " placeholder="Alguma preferência especial? " [(ngModel)]="formData.observacoes " name="observacoes "></textarea>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="submit-btn " (click)="criarReserva() " [disabled]="loading ">
      <span *ngIf="loading " class="loading-spinner "></span>
      {{ loading ? 'Processando...' : 'Confirmar Reserva' }}
    </button>
    </div>
</div>
