<mat-card>

    <mat-card-header>
        <h1>{{title}}</h1>
    </mat-card-header>
    <mat-card-content>

        <table mat-table [dataSource]="dataSource" class="Destino-table">

            <ng-container matColumnDef="nomeCidade">
                <th mat-header-cell *matHeaderCellDef>NomeCidade</th>
                <td mat-cell *matCellDef="let Destino">{{Destino.nomeCidade}}</td>
            </ng-container>

            <ng-container matColumnDef="pais">
                <th mat-header-cell *matHeaderCellDef>Pais</th>
                <td mat-cell *matCellDef="let Destino">{{Destino.pais}}</td>
            </ng-container>

            <ng-container matColumnDef="descricao">
                <th mat-header-cell *matHeaderCellDef>Descricao</th>
                <td mat-cell *matCellDef="let Destino">{{Destino.descricao}}</td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns:displayedColumns;"></tr>
        </table>
        <mat-card-actions>
            <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" [pageSize]="10" showFirstLastButtons>
            </mat-paginator>
        </mat-card-actions>
    </mat-card-content>


</mat-card>
