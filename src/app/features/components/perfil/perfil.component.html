<div class="perfil-container">
    <div class="perfil-header">
        <h1>Meu Perfil</h1>
        <button class="btn-logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sair
        </button>
    </div>

    <!-- Toast -->
    <div *ngIf="showToast" class="toast" [class.toast-success]="toastType === 'success'">
        {{ toastMessage }}
    </div>

    <div class="perfil-content">
        <!-- Card de Informações -->
        <div class="info-card">
            <div class="card-header">
                <h2>Informações Pessoais</h2>
                <button *ngIf="!editMode" class="btn-edit" (click)="enableEdit()">
              ✏️ Editar
            </button>
            </div>

            <div *ngIf="loading" class="loading">Carregando...</div>

            <form *ngIf="usuario && !loading" class="info-form" (ngSubmit)="salvarPerfil()">
                <div class="avatar-section">
                    <div class="avatar">
                        {{ getInitials() }}
                    </div>
                    <div class="user-meta">
                        <h3>{{ usuario.nomeUsuario }}</h3>
                        <span class="role-badge" *ngFor="let role of usuario.roles">
                  {{ role }}
                </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" [(ngModel)]="formData.nomeUsuario" name=" nomeUsuario " [disabled]=" editMode " class="form-input ">
                </div>

                <div class="form-group ">
                    <label>Email</label>
                    <input type="email " [(ngModel)]="formData.email " name="email " [disabled]="editMode " class="form-input ">
                </div>

                <div class="form-group ">
                    <label>Telefone</label>
                    <input type="tel " [(ngModel)]="formData.telefone " name="telefone " [disabled]=" editMode " placeholder="(+244) 900 000 000 " class="form-input ">
                </div>

                <div class="form-group ">
                    <label>Data de Cadastro</label>
                    <input type="text " [value]="usuario.dataCriacao | date: 'dd/MM/yyyy HH:mm' " disabled class="form-input ">
                </div>

                <div class="form-group ">
                    <label>Status</label>
                    <span class="status-badge " [class.active]="usuario.ativo ">
                {{ usuario.ativo ? '✓ Ativo' : '✗ Inativo' }}
              </span>
                </div>

                <div *ngIf="editMode " class="form-actions ">
                    <button type="button " class="btn-cancel " (click)="cancelEdit() ">
                Cancelar
              </button>
                    <button type="submit " class="btn-save " [disabled]="saving ">
                {{ saving ? 'Salvando...' : 'Salvar' }}
              </button>
                </div>
            </form>
        </div>

        <!-- Card de Alterar Senha -->
        <div class="senha-card ">
            <div class="card-header ">
                <h2>Alterar Senha</h2>
            </div>

            <form class="senha-form " (ngSubmit)="alterarSenha() ">
                <div class="form-group ">
                    <label>Senha Atual</label>
                    <input type="password " [(ngModel)]="senhaData.senhaAtual " name="senhaAtual " placeholder="Digite sua senha atual " class="form-input ">
                </div>

                <div class="form-group ">
                    <label>Nova Senha</label>
                    <input type="password " [(ngModel)]="senhaData.novaSenha " name="novaSenha " placeholder="Mínimo 6 caracteres " minlength="6 " maxlength="12 " class="form-input ">
                    <small class="hint ">Entre 6 e 12 caracteres</small>
                </div>

                <div class="form-group ">
                    <label>Confirmar Nova Senha</label>
                    <input type="password " [(ngModel)]="senhaData.confirmarSenha " name="confirmarSenha " placeholder="Confirme a nova senha " class="form-input ">



                </div>

                <button type="submit " class="btn-change-password " [disabled]="changingPassword ">
              {{ changingPassword ? 'Alterando...' : 'Alterar Senha' }}
            </button>
            </form>
        </div>

        <!-- Card de Estatísticas -->
        <div class="stats-card ">
            <h2>Estatísticas</h2>
            <div class="stats-grid ">
                <div class="stat-item ">
                    <div class="stat-icon ">📦</div>
                    <div class="stat-info ">
                        <span class="stat-value ">0</span>
                        <span class="stat-label ">Reservas</span>
                    </div>
                </div>
                <div class="stat-item ">
                    <div class="stat-icon ">🌍</div>
                    <div class="stat-info ">
                        <span class="stat-value ">0</span>
                        <span class="stat-label ">Destinos Visitados</span>
                    </div>
                </div>
                <div class="stat-item ">
                    <div class="stat-icon ">⭐</div>
                    <div class="stat-info ">
                        <span class="stat-value ">0</span>
                        <span class="stat-label ">Avaliações</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
