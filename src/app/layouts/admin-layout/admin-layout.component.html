<div class="admin-layout">

    <!-- ========================================
         SIDEBAR
    ======================================== -->
    <aside class="sidebar" [class.collapsed]="!sidebarOpen">

        <!-- Logo -->
        <div class="sidebar-header">
            <div class="logo">
                <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                <span class="logo-text" *ngIf="sidebarOpen">Mambo-Express</span>
            </div>
        </div>

        <!-- Menu de Navegação -->
        <nav class="sidebar-nav">
            <a *ngFor="let item of menuItems" [routerLink]="item.route" class="nav-item" [class.active]="item.active" (click)="updateActiveMenu()">
                <span class="nav-icon">{{ item.icon }}</span>
                <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
            </a>
        </nav>

        <!-- Toggle Sidebar -->
        <button class="sidebar-toggle" (click)="toggleSidebar()">
            <svg *ngIf="sidebarOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            <svg *ngIf="!sidebarOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </aside>

    <!-- ========================================
         MAIN CONTENT
    ======================================== -->
    <div class="main-content">

        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <button class="mobile-menu-toggle" (click)="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h1 class="page-title">Painel Administrativo</h1>
            </div>

            <div class="header-right">
                <!-- Notificações -->
                <button class="header-icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="badge">3</span>
                </button>

                <!-- Perfil -->
                <div class="user-menu" [class.open]="userMenuOpen">
                    <button class="user-menu-trigger" (click)="toggleUserMenu()">
                        <div class="user-avatar">
                            <span>{{ adminName.charAt(0) }}</span>
                        </div>
                        <div class="user-info">
                            <span class="user-name">{{ adminName }}</span>
                            <span class="user-role">Administrador</span>
                        </div>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>

                    <div class="user-dropdown" *ngIf="userMenuOpen">
                        <button class="menu-item clouse" (click)="clouse()">x</button>
                        <a class="dropdown-item" (click)="goToProfile()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg> Meu Perfil
                        </a>
                        <a class="dropdown-item" (click)="goToHome()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            </svg> Ir para o Site
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item danger" (click)="logout()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" y1="12" x2="9" y2="12"/>
                            </svg> Sair
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content-area">
            <router-outlet></router-outlet>
        </main>

        <!-- Footer -->
        <footer class="admin-footer">
            <p>&copy; 2024 Mambo-Express
                <. Todos os direitos reservados.</p>
                    <div class="footer-links">
                        <a href="#">Suporte</a>
                        <a href="#">Documentação</a>
                        <a href="#">Termos</a>
                    </div>
        </footer>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" *ngIf="sidebarOpen" (click)="toggleSidebar()">
    </div>
</div>
